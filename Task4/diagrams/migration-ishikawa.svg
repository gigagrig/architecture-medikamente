    <tspan x="710" dy="25">Привычный ввод в старые Excel</tspan>
  </text>
  <line x1="708" y1="988" x2="1159.6521739130435" y2="988" stroke="#be185d" stroke-width="2" />
  <text x="710" y="1056" fill="#172554" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">
