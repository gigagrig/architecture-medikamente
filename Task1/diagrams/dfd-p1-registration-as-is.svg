      <text text-anchor="start" x="60" y="-608.9" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Пациент (Patient)</text>
      <text text-anchor="start" x="98.5" y="-583.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Субъект ПДн</text>
      <text text-anchor="start" x="80.5" y="-568.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Очное обращение</text>
    </g>
    <g id="node3" class="node">
      <title>1.1</title>
      <path fill="#fff1f2" stroke="#b91c1c" stroke-width="2" d="M862,-676.5C862,-676.5 592,-676.5 592,-676.5 586,-676.5 580,-670.5 580,-664.5 580,-664.5 580,-544.5 580,-544.5 580,-538.5 586,-532.5 592,-532.5 592,-532.5 862,-532.5 862,-532.5 868,-532.5 874,-538.5 874,-544.5 874,-544.5 874,-664.5 874,-664.5 874,-670.5 868,-676.5 862,-676.5" />
      <text text-anchor="start" x="683" y="-652.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Процесс 1.1</text>
      <text text-anchor="start" x="631.5" y="-627.9" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Сбор ПДн и анкеты</text>
      <text text-anchor="start" x="626" y="-602.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Ручное заполнение бланка:</text>
      <text text-anchor="start" x="625.5" y="-587.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">паспорт, контакты, работа,</text>
      <text text-anchor="start" x="631.5" y="-572.3" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">хронические заболевания</text>
      <text text-anchor="start" x="654.5" y="-550.3" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Избыточный сбор</text>
    </g>
