<svg xmlns="http://www.w3.org/2000/svg" width="1519" height="979" viewBox="0 0 1519 979" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 3 (To-Be): Защищенная электронная медицинская карта (ЭМК / EHR)</title>
  <desc id="description">Целевое состояние: ABAC (доступ только на время визита), УКЭП врача, стандарты FHIR, S3 WORM, SIEM-аудит</desc>
  <rect width="1519" height="979" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 3 (To-Be): Защищенная электронная медицинская карта (ЭМК / EHR)</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Целевое состояние: ABAC (доступ только на время визита), УКЭП врача, стандарты FHIR, S3 WORM, SIEM-аудит</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,791.0)">
