<svg xmlns="http://www.w3.org/2000/svg" width="1905" height="909" viewBox="0 0 1905 909" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 5 (As-Is): Оплата медицинских услуг и фискализация</title>
  <desc id="description">Текущее состояние: двойной учет (Excel + 1С), незащищенный протокол ККМ, файловая БД «1С:Бухгалтерия»</desc>
  <rect width="1905" height="909" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 5 (As-Is): Оплата медицинских услуг и фискализация</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Текущее состояние: двойной учет (Excel + 1С), незащищенный протокол ККМ, файловая БД «1С:Бухгалтерия»</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,877.0)">
    <title>DFD</title>
