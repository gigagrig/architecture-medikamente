      <text text-anchor="start" x="974" y="-611.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">файл Excel кассира</text>
      <text text-anchor="start" x="989" y="-589.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Двойной учет</text>
    </g>
