      <text text-anchor="start" x="636" y="-643.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Запрос расписания (API)</text>
      <text text-anchor="start" x="642.5" y="-617.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Фильтрация доступных слотов</text>
      <text text-anchor="start" x="647" y="-602.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Без раскрытия чужих данных</text>
      <text text-anchor="start" x="687" y="-587.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Rate limiting + WAF</text>
      <text text-anchor="start" x="685.5" y="-565.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Data Minimization</text>
    </g>
