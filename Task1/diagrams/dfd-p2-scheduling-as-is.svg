      <text text-anchor="start" x="1128" y="-659.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Файловый диск: \Journals\*</text>
      <text text-anchor="start" x="1145" y="-633.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Таблицы: Journal-Doctor-FIO.xlsx</text>
      <text text-anchor="start" x="1121" y="-618.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Каждый врач и администратор имеет</text>
      <text text-anchor="start" x="1133" y="-603.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">доступ к расписанию ВСЕХ врачей</text>
      <text text-anchor="start" x="1227.5" y="-588.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">клиники!</text>
      <text text-anchor="start" x="1123.5" y="-573.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Нарушение ст. 13 323-ФЗ (врачебная</text>
      <text text-anchor="start" x="1236.5" y="-558.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">тайна)</text>
      <text text-anchor="start" x="1187" y="-536.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Критический риск</text>
      <polyline fill="none" stroke="#b91c1c" stroke-width="2" points="1416,-710.5 1106,-710.5 1106,-517.5 1416,-517.5 " />
    </g>
