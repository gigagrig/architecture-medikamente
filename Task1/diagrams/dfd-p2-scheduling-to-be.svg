      <text text-anchor="start" x="660" y="-343.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Appointment Service (OLTP)</text>
      <text text-anchor="start" x="624" y="-328.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Атомарная транзакция в PostgreSQL</text>
      <text text-anchor="start" x="675.5" y="-313.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Тег: PHI_APPOINTMENT</text>
      <text text-anchor="start" x="699.5" y="-291.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Zero Collisions</text>
    </g>
