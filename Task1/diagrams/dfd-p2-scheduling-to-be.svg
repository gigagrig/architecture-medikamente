  <rect x="20" y="857.0" width="1531" height="142" rx="8" fill="#f0fdf4" stroke="#166534" />
  <text x="32" y="878.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="700">Защитные механизмы</text>
  <text x="32" y="899.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Врач видит ТОЛЬКО свое расписание (ABAC)</text>
  <text x="32" y="920.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Пациент видит только свободные временные окна</text>
  <text x="32" y="941.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Нет утечки диагнозов</text>
  <text x="32" y="962.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Логирование в SIEM</text>
  <text x="32" y="983.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Высокая доступность</text>
</svg>
