<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 2 (To-Be): Автоматизированная запись на прием с RBAC/ABAC</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Целевое состояние: ЛК пациента, RBAC изоляция журналов врачей, Kafka нотификации, токенизация appointments</text>

  <!-- External Entity: Пациент (Client) -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="90" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="106" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="135" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Client)</text>
    <text x="115.0" y="153" font-size="10" fill="#64748b" text-anchor="middle">Web-портал / Мобильное App
Автономная запись 24/7</text>
  </g>
  <!-- External Entity: Ресепшен (Staff) -->
  <g filter="url(#shadow)">
    <rect x="30" y="240" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="240" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="256" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="285" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Ресепшен (Staff)</text>
    <text x="115.0" y="303" font-size="10" fill="#64748b" text-anchor="middle">АРМ ресепшена
Только общие слоты</text>
  </g>
  <!-- External Entity: Врач (Doctor) -->
  <g filter="url(#shadow)">
    <rect x="30" y="390" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="390" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="406" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="435" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Врач (Doctor)</text>
    <text x="115.0" y="453" font-size="10" fill="#64748b" text-anchor="middle">АРМ врача (RBAC/ABAC)
Видит ТОЛЬКО своих пациентов</text>
  </g>
  <!-- Process 2.1: Запрос расписания (API) -->
  <g filter="url(#shadow)">
    <rect x="250" y="100" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 124 L 470 124" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="101" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="116" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 2.1</text>
    <text x="458" y="116" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Data Minimization</text>
    <text x="360.0" y="146" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Запрос расписания (API)</text>
    <text x="360.0" y="164" font-size="10" fill="#475569" text-anchor="middle">Фильтрация доступных слотов</text>
    <text x="360.0" y="178" font-size="10" fill="#475569" text-anchor="middle">Без раскрытия чужих данных</text>
    <text x="360.0" y="192" font-size="10" fill="#475569" text-anchor="middle">Rate limiting + WAF</text>
  </g>
  <!-- Process 2.2: Бронирование визита -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 274 L 470 274" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="251" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="266" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 2.2</text>
    <text x="458" y="266" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Zero Collisions</text>
    <text x="360.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Бронирование визита</text>
    <text x="360.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Appointment Service (OLTP)</text>
    <text x="360.0" y="328" font-size="10" fill="#475569" text-anchor="middle">Атомарная транзакция в PostgreSQL</text>
    <text x="360.0" y="342" font-size="10" fill="#475569" text-anchor="middle">Тег: PHI_APPOINTMENT</text>
  </g>
  <!-- Process 2.3: Оповещения и напоминания -->
  <g filter="url(#shadow)">
    <rect x="250" y="400" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 424 L 470 424" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="401" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="416" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 2.3</text>
    <text x="458" y="416" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Privacy-preserving</text>
    <text x="360.0" y="446" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Оповещения и напоминания</text>
    <text x="360.0" y="464" font-size="10" fill="#475569" text-anchor="middle">Notification Service (Kafka)</text>
    <text x="360.0" y="478" font-size="10" fill="#475569" text-anchor="middle">SMS/Push за 24ч до приема</text>
    <text x="360.0" y="492" font-size="10" fill="#475569" text-anchor="middle">Без раскрытия диагноза</text>
  </g>
  <!-- Data Store D1: Appointment DB (PostgreSQL) -->
  <g filter="url(#shadow)">
    <rect x="540" y="170" width="240" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="170" x2="780" y2="170" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="265" x2="780" y2="265" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="170" x2="540" y2="265" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="170" x2="576" y2="265" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="221.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D1</text>
    <text x="586" y="190" font-size="12" font-weight="bold" fill="#0f172a">Appointment DB (PostgreSQL)</text>
    <text x="586" y="206" font-size="10" fill="#64748b">Слоты, patient_uuid, doctor_id</text>
    <text x="586" y="219" font-size="10" fill="#64748b">ABAC правила доступа (OPA)</text>
    <text x="586" y="232" font-size="10" fill="#64748b">Исключены коллизии блокировок</text>
    <rect x="710" y="174" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="743" y="187" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">TDE / RLS</text>
  </g>
  <!-- Data Store D2: Message Broker (Kafka mTLS) -->
  <g filter="url(#shadow)">
    <rect x="540" y="340" width="240" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="340" x2="780" y2="340" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="435" x2="780" y2="435" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="340" x2="540" y2="435" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="340" x2="576" y2="435" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="391.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D2</text>
    <text x="586" y="360" font-size="12" font-weight="bold" fill="#0f172a">Message Broker (Kafka mTLS)</text>
    <text x="586" y="376" font-size="10" fill="#64748b">Топик appointments.events</text>
    <text x="586" y="389" font-size="10" fill="#64748b">События: Created, Confirmed, Cancelled</text>
    <text x="586" y="402" font-size="10" fill="#64748b">Шифрование payload + audit</text>
    <rect x="710" y="344" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="743" y="357" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Audit & Events</text>
  </g>
  <!-- Security Control: Защитные механизмы -->
  <g>
    <rect x="810" y="190" width="155" height="180" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="887.5" y="206" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Защитные механизмы</text>
    <text x="887.5" y="220" font-size="9" fill="#166534" text-anchor="middle">• Врач видит ТОЛЬКО</text>
    <text x="887.5" y="232" font-size="9" fill="#166534" text-anchor="middle">  свое расписание (ABAC)</text>
    <text x="887.5" y="244" font-size="9" fill="#166534" text-anchor="middle">• Пациент видит только</text>
    <text x="887.5" y="256" font-size="9" fill="#166534" text-anchor="middle">  свободные временные окна</text>
    <text x="887.5" y="268" font-size="9" fill="#166534" text-anchor="middle">• Нет утечки диагнозов</text>
    <text x="887.5" y="280" font-size="9" fill="#166534" text-anchor="middle">• Логирование в SIEM</text>
    <text x="887.5" y="292" font-size="9" fill="#166534" text-anchor="middle">• Высокая доступность</text>
  </g>
  <line x1="200" y1="130" x2="250" y2="130" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="116.0" y="120.5" width="218.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="133.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">HTTPS TLS 1.3: Поиск врача/слота</text>
  <line x1="200" y1="280" x2="250" y2="270" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="132.25" y="265.5" width="185.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="278.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Создание записи с ресепшена</text>
  <line x1="200" y1="430" x2="250" y2="420" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="96.5" y="415.5" width="257.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="428.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Запрос журнала (только свой doctor_id)</text>
  <line x1="360" y1="195" x2="360" y2="250" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="306.25" y="213.0" width="107.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="225.5" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Выбор интервала</text>
  <line x1="470" y1="270" x2="540" y2="230" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="438.25" y="240.5" width="133.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="253.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Фиксация брони в БД</text>
  <line x1="360" y1="345" x2="360" y2="400" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="299.75" y="363.0" width="120.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="375.5" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Инициация события</text>
  <line x1="470" y1="420" x2="540" y2="390" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="422.0" y="395.5" width="166.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="408.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Публикация брони в Kafka</text>
</svg>