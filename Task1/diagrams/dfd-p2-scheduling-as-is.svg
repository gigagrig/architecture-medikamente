      <text text-anchor="middle" x="431" y="-509.8" font-family="DejaVu Sans" font-size="14.00" fill="#475569">Открытие файла Excel</text>
      <text text-anchor="middle" x="431" y="-494.8" font-family="DejaVu Sans" font-size="14.00" fill="#475569">доктора через SMB</text>
    </g>
    <g id="node3" class="node">
