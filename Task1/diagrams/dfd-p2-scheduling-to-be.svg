<svg xmlns="http://www.w3.org/2000/svg" width="1571" height="1026" viewBox="0 0 1571 1026" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 2 (To-Be): Автоматизированная запись на прием с RBAC/ABAC</title>
  <desc id="description">Целевое состояние: ЛК пациента, RBAC изоляция журналов врачей, Kafka нотификации, токенизация appointments</desc>
  <rect width="1571" height="1026" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 2 (To-Be): Автоматизированная запись на прием с RBAC/ABAC</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Целевое состояние: ЛК пациента, RBAC изоляция журналов врачей, Kafka нотификации, токенизация appointments</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,838.0)">
    <title>DFD</title>
    <polygon fill="white" stroke="transparent" points="-8.64,8.64 -8.64,-703.64 1523.64,-703.64 1523.64,8.64 -8.64,8.64" />
    <g id="node1" class="node">
      <title>E1</title>
      <polygon fill="#f0f9ff" stroke="#0369a1" stroke-width="2" points="294,-673 0,-673 0,-567 294,-567 294,-673" />
      <text text-anchor="start" x="65.5" y="-648.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Внешняя сущность E1</text>
      <text text-anchor="start" x="66.5" y="-624.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Пациент (Client)</text>
      <text text-anchor="start" x="40" y="-598.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Web-портал / Мобильное App</text>
      <text text-anchor="start" x="58" y="-583.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Автономная запись 24/7</text>
    </g>
    <g id="node4" class="node">
      <title>2.1</title>
      <path fill="#f0fdf4" stroke="#166534" stroke-width="2" d="M892,-692C892,-692 622,-692 622,-692 616,-692 610,-686 610,-680 610,-680 610,-560 610,-560 610,-554 616,-548 622,-548 622,-548 892,-548 892,-548 898,-548 904,-554 904,-560 904,-560 904,-680 904,-680 904,-686 898,-692 892,-692" />
