<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 3 (To-Be): Защищенная электронная медицинская карта (ЭМК / EHR)</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Целевое состояние: ABAC (доступ только на время визита), УКЭП врача, стандарты FHIR, S3 WORM, SIEM-аудит</text>

  <!-- External Entity: Пациент (Patient) -->
  <g filter="url(#shadow)">
    <rect x="30" y="100" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="100" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="116" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="145" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Patient)</text>
    <text x="115.0" y="163" font-size="10" fill="#64748b" text-anchor="middle">Субъект ПДн
Личный кабинет (ЛК)</text>
  </g>
  <!-- External Entity: Врач (Doctor) -->
  <g filter="url(#shadow)">
    <rect x="30" y="280" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="280" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="296" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="325" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Врач (Doctor)</text>
    <text x="115.0" y="343" font-size="10" fill="#64748b" text-anchor="middle">АРМ врача
Аппаратный токен УКЭП</text>
  </g>
  <!-- Process 3.1: ABAC авторизация доступа -->
  <g filter="url(#shadow)">
    <rect x="250" y="95" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 119 L 470 119" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="96" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="111" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 3.1</text>
    <text x="458" y="111" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Strict ABAC</text>
    <text x="360.0" y="141" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">ABAC авторизация доступа</text>
    <text x="360.0" y="159" font-size="10" fill="#475569" text-anchor="middle">OPA Policy Engine:</text>
    <text x="360.0" y="173" font-size="10" fill="#475569" text-anchor="middle">доступ к медкарте ТОЛЬКО при</text>
    <text x="360.0" y="187" font-size="10" fill="#475569" text-anchor="middle">наличии активной записи на прием</text>
  </g>
  <!-- Process 3.2: Ведение протокола (EHR) -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 274 L 470 274" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="251" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="266" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 3.2</text>
    <text x="458" y="266" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">УКЭП / Минздрав 947н</text>
    <text x="360.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Ведение протокола (EHR)</text>
    <text x="360.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Структурированный формат FHIR</text>
    <text x="360.0" y="328" font-size="10" fill="#475569" text-anchor="middle">Тег: PHI_SPECIAL_RESTRICTED</text>
    <text x="360.0" y="342" font-size="10" fill="#475569" text-anchor="middle">Подписание УКЭП врача (947н)</text>
  </g>
  <!-- Process 3.3: Иммутабельное архивирование -->
  <g filter="url(#shadow)">
    <rect x="250" y="405" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 429 L 470 429" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="406" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="421" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 3.3</text>
    <text x="458" y="421" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">WORM / Immutability</text>
    <text x="360.0" y="451" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Иммутабельное архивирование</text>
    <text x="360.0" y="469" font-size="10" fill="#475569" text-anchor="middle">Шифрование AES-256 (TDE)</text>
    <text x="360.0" y="483" font-size="10" fill="#475569" text-anchor="middle">Политика неизменяемости (WORM)</text>
    <text x="360.0" y="497" font-size="10" fill="#475569" text-anchor="middle">Запрет скрытого редактирования</text>
  </g>
  <!-- Data Store D1: EHR Clinical DB (PostgreSQL) -->
  <g filter="url(#shadow)">
    <rect x="540" y="105" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="105" x2="770" y2="105" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="200" x2="770" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="105" x2="540" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="105" x2="576" y2="200" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="156.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D1</text>
    <text x="586" y="125" font-size="12" font-weight="bold" fill="#0f172a">EHR Clinical DB (PostgreSQL)</text>
    <text x="586" y="141" font-size="10" fill="#64748b">Медицинские записи, диагнозы МКБ</text>
    <text x="586" y="154" font-size="10" fill="#64748b">Шифрование pgcrypto/TDE</text>
    <text x="586" y="167" font-size="10" fill="#64748b">Маскирование для не-врачей</text>
    <rect x="700" y="109" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="122" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">PostgreSQL TDE</text>
  </g>
  <!-- Data Store D2: Medical Docs (MinIO S3 SSE) -->
  <g filter="url(#shadow)">
    <rect x="540" y="255" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="255" x2="770" y2="255" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="350" x2="770" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="255" x2="540" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="255" x2="576" y2="350" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="306.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D2</text>
    <text x="586" y="275" font-size="12" font-weight="bold" fill="#0f172a">Medical Docs (MinIO S3 SSE)</text>
    <text x="586" y="291" font-size="10" fill="#64748b">Подписанные PDF/A, снимки, ЭКГ</text>
    <text x="586" y="304" font-size="10" fill="#64748b">KMS Envelope Encryption</text>
    <text x="586" y="317" font-size="10" fill="#64748b">Object Lock (Immutability)</text>
    <rect x="700" y="259" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="272" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">SSE-KMS / WORM</text>
  </g>
  <!-- Data Store D3: SIEM & Audit Vault -->
  <g filter="url(#shadow)">
    <rect x="540" y="405" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="405" x2="770" y2="405" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="500" x2="770" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="405" x2="540" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="405" x2="576" y2="500" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="456.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D3</text>
    <text x="586" y="425" font-size="12" font-weight="bold" fill="#0f172a">SIEM & Audit Vault</text>
    <text x="586" y="441" font-size="10" fill="#64748b">Полная фиксация каждого чтения!</text>
    <text x="586" y="454" font-size="10" fill="#64748b">Vector -> OpenSearch -> Wazuh</text>
    <text x="586" y="467" font-size="10" fill="#64748b">Срок хранения логов 5 лет</text>
    <rect x="700" y="409" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="422" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Неотслеживаемость исключена</text>
  </g>
  <!-- Security Control: Гарантии безопасности -->
  <g>
    <rect x="800" y="180" width="160" height="195" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="880.0" y="196" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Гарантии безопасности</text>
    <text x="880.0" y="210" font-size="9" fill="#166534" text-anchor="middle">• Врач другой специальности</text>
    <text x="880.0" y="222" font-size="9" fill="#166534" text-anchor="middle">  НЕ МОЖЕТ открыть карту</text>
    <text x="880.0" y="234" font-size="9" fill="#166534" text-anchor="middle">• Каждая запись подписана</text>
    <text x="880.0" y="246" font-size="9" fill="#166534" text-anchor="middle">  личной УКЭП врача</text>
    <text x="880.0" y="258" font-size="9" fill="#166534" text-anchor="middle">• Невозможно подделать</text>
    <text x="880.0" y="270" font-size="9" fill="#166534" text-anchor="middle">  или удалить историю болезни</text>
    <text x="880.0" y="282" font-size="9" fill="#166534" text-anchor="middle">• 100% аудит просмотров</text>
    <text x="880.0" y="294" font-size="9" fill="#166534" text-anchor="middle">• Полное соответствие 323-ФЗ</text>
  </g>
  <line x1="200" y1="310" x2="250" y2="160" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="135.5" y="225.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="238.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Запрос ЭМК пациента (mTLS)</text>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="277.0" y="210.5" width="166.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="223.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Разрешение OPA (ABAC OK)</text>
  <line x1="470" y1="145" x2="540" y2="145" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="402.5" y="135.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="148.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Чтение медкарты (Audit Logged)</text>
  <line x1="470" y1="290" x2="540" y2="290" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="412.25" y="280.5" width="185.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="293.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Сохранение протокола + УКЭП</text>
  <line x1="360" y1="345" x2="360" y2="405" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="290.0" y="365.5" width="140.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="378.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Блокировка изменений</text>
  <line x1="470" y1="445" x2="540" y2="445" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="435.0" y="435.5" width="140.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="448.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Отправка лога в SIEM</text>
  <line x1="250" y1="120" x2="200" y2="120" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="138.75" y="110.5" width="172.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="123.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Доступ к своей карте в ЛК</text>
</svg>