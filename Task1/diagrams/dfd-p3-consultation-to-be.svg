  <text x="32" y="831.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="700">Гарантии безопасности</text>
  <text x="32" y="852.0" font-family="DejaVu Sans" font-size="14" fill="#14532d" font-weight="400">• Врач другой специальности НЕ МОЖЕТ открыть карту</text>
