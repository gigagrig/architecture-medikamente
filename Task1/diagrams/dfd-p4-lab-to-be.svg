<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 4 (To-Be): Защищенная интеграция с лабораторией (Lab API / mTLS)</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Целевое состояние: деперсонализация биоматериала (barcode token), mTLS API контракты, Webhook, исключение утечек</text>

  <!-- External Entity: Пациент (Patient) -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="90" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="106" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="135" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Patient)</text>
    <text x="115.0" y="153" font-size="10" fill="#64748b" text-anchor="middle">Сдает биоматериал
Результаты в ЛК</text>
  </g>
  <!-- External Entity: Процедурный кабинет -->
  <g filter="url(#shadow)">
    <rect x="30" y="240" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="240" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="256" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="285" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Процедурный кабинет</text>
    <text x="115.0" y="303" font-size="10" fill="#64748b" text-anchor="middle">Медсестра (АРМ)
Маркировка пробирок</text>
  </g>
  <!-- External Entity: Внешняя лаборатория -->
  <g filter="url(#shadow)">
    <rect x="30" y="400" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="400" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="416" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="445" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Внешняя лаборатория</text>
    <text x="115.0" y="463" font-size="10" fill="#64748b" text-anchor="middle">Lab API Partner
Интеграция по стандарту</text>
  </g>
  <!-- Process 4.1: Деперсонализация заказа -->
  <g filter="url(#shadow)">
    <rect x="250" y="95" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 119 L 470 119" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="96" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="111" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 4.1</text>
    <text x="458" y="111" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Pseudonymization</text>
    <text x="360.0" y="141" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Деперсонализация заказа</text>
    <text x="360.0" y="159" font-size="10" fill="#475569" text-anchor="middle">Генерация sample_uuid и barcode.</text>
    <text x="360.0" y="173" font-size="10" fill="#475569" text-anchor="middle">Лаборатории передается ТОЛЬКО код,</text>
    <text x="360.0" y="187" font-size="10" fill="#475569" text-anchor="middle">пол, возраст (без ФИО и паспорта)</text>
  </g>
  <!-- Process 4.2: Защищенный API Gateway -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 274 L 470 274" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="251" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="266" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 4.2</text>
    <text x="458" y="266" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">mTLS / Zero Trust</text>
    <text x="360.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Защищенный API Gateway</text>
    <text x="360.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Взаимная аутентификация mTLS</text>
    <text x="360.0" y="328" font-size="10" fill="#475569" text-anchor="middle">Строгий OpenAPI контракт</text>
    <text x="360.0" y="342" font-size="10" fill="#475569" text-anchor="middle">Валидация входящей схемы</text>
  </g>
  <!-- Process 4.3: Реидентификация и доставка -->
  <g filter="url(#shadow)">
    <rect x="250" y="405" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 429 L 470 429" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="406" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="421" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 4.3</text>
    <text x="458" y="421" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Tokenization Vault</text>
    <text x="360.0" y="451" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Реидентификация и доставка</text>
    <text x="360.0" y="469" font-size="10" fill="#475569" text-anchor="middle">Сопоставление sample_uuid -> patient_uuid</text>
    <text x="360.0" y="483" font-size="10" fill="#475569" text-anchor="middle">в закрытом изолированном Vault.</text>
    <text x="360.0" y="497" font-size="10" fill="#475569" text-anchor="middle">Тег: PHI_LAB_RESULT</text>
  </g>
  <!-- Data Store D1: Token Vault (HashiCorp) -->
  <g filter="url(#shadow)">
    <rect x="540" y="105" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="105" x2="770" y2="105" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="200" x2="770" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="105" x2="540" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="105" x2="576" y2="200" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="156.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D1</text>
    <text x="586" y="125" font-size="12" font-weight="bold" fill="#0f172a">Token Vault (HashiCorp)</text>
    <text x="586" y="141" font-size="10" fill="#64748b">Таблица связки: barcode <-> patient_uuid</text>
    <text x="586" y="154" font-size="10" fill="#64748b">Доступна ТОЛЬКО Lab Service</text>
    <text x="586" y="167" font-size="10" fill="#64748b">Изолирована от внешнего контура</text>
    <rect x="700" y="109" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="122" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Isolated Vault</text>
  </g>
  <!-- Data Store D2: Lab Orders DB (PostgreSQL) -->
  <g filter="url(#shadow)">
    <rect x="540" y="255" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="255" x2="770" y2="255" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="350" x2="770" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="255" x2="540" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="255" x2="576" y2="350" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="306.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D2</text>
    <text x="586" y="275" font-size="12" font-weight="bold" fill="#0f172a">Lab Orders DB (PostgreSQL)</text>
    <text x="586" y="291" font-size="10" fill="#64748b">Статусы заказов, даты готовности</text>
    <text x="586" y="304" font-size="10" fill="#64748b">Шифрование TDE</text>
    <text x="586" y="317" font-size="10" fill="#64748b">Без персональных данных</text>
    <rect x="700" y="259" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="272" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Anonymized Orders</text>
  </g>
  <!-- Data Store D3: Results Storage (MinIO S3) -->
  <g filter="url(#shadow)">
    <rect x="540" y="405" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="405" x2="770" y2="405" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="500" x2="770" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="405" x2="540" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="405" x2="576" y2="500" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="456.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D3</text>
    <text x="586" y="425" font-size="12" font-weight="bold" fill="#0f172a">Results Storage (MinIO S3)</text>
    <text x="586" y="441" font-size="10" fill="#64748b">Зашифрованные PDF бланки</text>
    <text x="586" y="454" font-size="10" fill="#64748b">SSE-KMS шифрование</text>
    <text x="586" y="467" font-size="10" fill="#64748b">Доступ пациенту только к своим!</text>
    <rect x="700" y="409" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="422" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">SSE-KMS / RLS</text>
  </g>
  <!-- Security Control: Принципы защиты -->
  <g>
    <rect x="800" y="180" width="160" height="195" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="880.0" y="196" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Принципы защиты</text>
    <text x="880.0" y="210" font-size="9" fill="#166534" text-anchor="middle">• Партнер НЕ ЗНАЕТ ФИО</text>
    <text x="880.0" y="222" font-size="9" fill="#166534" text-anchor="middle">  пациента (только barcode)</text>
    <text x="880.0" y="234" font-size="9" fill="#166534" text-anchor="middle">• Никаких Excel реестров</text>
    <text x="880.0" y="246" font-size="9" fill="#166534" text-anchor="middle">• Никаких пересылок по mail</text>
    <text x="880.0" y="258" font-size="9" fill="#166534" text-anchor="middle">• Двусторонний mTLS</text>
    <text x="880.0" y="270" font-size="9" fill="#166534" text-anchor="middle">• Исключен просмотр чужих</text>
    <text x="880.0" y="282" font-size="9" fill="#166534" text-anchor="middle">  анализов другими клиентами</text>
  </g>
  <line x1="200" y1="270" x2="250" y2="160" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="119.25" y="205.5" width="211.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="218.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Создание заказа на исследование</text>
  <line x1="470" y1="140" x2="540" y2="140" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="418.75" y="130.5" width="172.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="143.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Сохранение токена barcode</text>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="231.5" y="210.5" width="257.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="223.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Передача деперсонализированного заказа</text>
  <line x1="250" y1="310" x2="200" y2="420" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="106.25" y="355.5" width="237.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="368.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">mTLS API: отправка barcode + анализ</text>
  <line x1="200" y1="450" x2="250" y2="440" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="112.75" y="435.5" width="224.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="448.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">mTLS Webhook: результат с barcode</text>
  <line x1="360" y1="345" x2="360" y2="405" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="260.75" y="365.5" width="198.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="378.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Валидация подписи лаборатории</text>
  <line x1="470" y1="440" x2="540" y2="440" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="418.75" y="430.5" width="172.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="443.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Сохранение PDF в MinIO S3</text>
  <line x1="250" y1="110" x2="200" y2="110" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="122.5" y="100.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="113.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Push-уведомление в ЛК пациента</text>
</svg>