      <text text-anchor="start" x="662" y="-300.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">файл Patients.xlsx</text>
      <text text-anchor="start" x="650" y="-278.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Нет контроля прав</text>
