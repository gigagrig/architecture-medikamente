<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1360" viewBox="0 0 2280 1360">
  <title>Исикава: причины деградации при миграции Медикаменте</title>
  <desc>Шесть категорий, восемнадцать причин; идентификаторы связаны с реестром migration-risks.md.</desc>
  <rect width="2280" height="1360" fill="#ffffff" />
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155" />
    </marker>
  </defs>
  <text x="77" y="63" fill="#172554" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="bold">
    <tspan x="77" dy="0">МЕДИКАМЕНТЕ · Причины деградации при миграции</tspan>
  </text>
  <text x="77" y="112" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="normal">
    <tspan x="77" dy="0">Диаграмма Исикавы: факты исходного устройства и проверяемые гипотезы. Коды раскрыты в реестре рисков.</tspan>
  </text>
  <line x1="70" y1="680" x2="2010" y2="680" stroke="#334155" stroke-width="5" marker-end="url(#arrow)" />
  <rect x="2020" y="584" width="235" height="190" fill="#fff1f2" stroke="#991b1b" rx="10" stroke-width="2" />
  <text x="2032" y="613" fill="#991b1b" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="bold">
