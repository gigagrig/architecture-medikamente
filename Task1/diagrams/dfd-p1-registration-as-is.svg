<svg xmlns="http://www.w3.org/2000/svg" width="1384" height="862" viewBox="0 0 1384 862" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 1 (As-Is): Первичная регистрация пациента и оформление документов</title>
  <desc id="description">Текущее состояние: ручной сбор избыточных ПДн, хранение сканов на общем сетевом диске без шифрования и разграничения прав</desc>
  <rect width="1384" height="862" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 1 (As-Is): Первичная регистрация пациента и оформление документов</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Текущее состояние: ручной сбор избыточных ПДн, хранение сканов на общем сетевом диске без шифрования и разграничения прав</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,830.0)">
    <title>DFD</title>
    <polygon fill="white" stroke="transparent" points="-8.64,8.64 -8.64,-695.64 1336.64,-695.64 1336.64,8.64 -8.64,8.64" />
    <g id="node1" class="node">
      <title>E1</title>
