      <text text-anchor="start" x="735" y="-674.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Процесс 1.1</text>
      <text text-anchor="start" x="630" y="-650.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Минимизированный сбор ПДн</text>
      <text text-anchor="start" x="659" y="-624.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Исключены место работы/учебы</text>
      <text text-anchor="start" x="644" y="-609.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Только необходимые ФИО, телефон,</text>
      <text text-anchor="start" x="675.5" y="-594.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">паспорт и электронное ИДС</text>
      <text text-anchor="start" x="707.5" y="-572.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Data Minimization</text>
    </g>
