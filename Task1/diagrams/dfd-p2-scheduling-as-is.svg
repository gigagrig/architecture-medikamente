      <text text-anchor="start" x="608" y="-69.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Ручной ввод ФИО, телефона,</text>
      <text text-anchor="start" x="618" y="-54.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">специальности и причины</text>
