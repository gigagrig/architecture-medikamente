<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 6 (To-Be): Контур обезличенной аналитики (Data Lakehouse & Privacy Gateway)</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Целевое состояние: Privacy Gateway (k-anonymity), ClickHouse Data Lake, Apache Superset, исключение PII из аналитики</text>

  <!-- External Entity: Бизнес-аналитик (BA) -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="90" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="106" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="135" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Бизнес-аналитик (BA)</text>
    <text x="115.0" y="153" font-size="10" fill="#64748b" text-anchor="middle">Доступ через Web BI
Без права скачивания сырых ПДн</text>
  </g>
  <!-- External Entity: ML / AI инженеры -->
  <g filter="url(#shadow)">
    <rect x="30" y="250" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="250" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="266" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="295" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">ML / AI инженеры</text>
    <text x="115.0" y="313" font-size="10" fill="#64748b" text-anchor="middle">Обучение моделей LLM/ML
ТОЛЬКО на обезличенных сетах</text>
  </g>
  <!-- External Entity: Руководство клиники -->
  <g filter="url(#shadow)">
    <rect x="30" y="405" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="405" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="421" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="450" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Руководство клиники</text>
    <text x="115.0" y="468" font-size="10" fill="#64748b" text-anchor="middle">Дашборды в BI Superset
Метрики в реальном времени</text>
  </g>
  <!-- Process 6.1: CDC & ETL Экстракция -->
  <g filter="url(#shadow)">
    <rect x="250" y="95" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 119 L 470 119" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="96" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="111" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 6.1</text>
    <text x="458" y="111" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">CDC Streaming</text>
    <text x="360.0" y="141" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">CDC & ETL Экстракция</text>
    <text x="360.0" y="159" font-size="10" fill="#475569" text-anchor="middle">Debezium + Kafka Connect</text>
    <text x="360.0" y="173" font-size="10" fill="#475569" text-anchor="middle">Потоковое извлечение изменений</text>
    <text x="360.0" y="187" font-size="10" fill="#475569" text-anchor="middle">из PostgreSQL (OLTP)</text>
  </g>
  <!-- Process 6.2: Privacy & Anonymization Engine -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 274 L 470 274" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="251" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="266" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 6.2</text>
    <text x="458" y="266" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Роскомнадзор 996</text>
    <text x="360.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Privacy & Anonymization Engine</text>
    <text x="360.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Удаление прямых идентификаторов</text>
    <text x="360.0" y="328" font-size="10" fill="#475569" text-anchor="middle">К-анонимизация (возрастные группы)</text>
    <text x="360.0" y="342" font-size="10" fill="#475569" text-anchor="middle">Дифференциальная приватность</text>
  </g>
  <!-- Process 6.3: Витрины данных и BI -->
  <g filter="url(#shadow)">
    <rect x="250" y="405" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 429 L 470 429" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="406" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="421" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 6.3</text>
    <text x="458" y="421" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Zero Raw PII</text>
    <text x="360.0" y="451" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Витрины данных и BI</text>
    <text x="360.0" y="469" font-size="10" fill="#475569" text-anchor="middle">Агрегаты в ClickHouse (OLAP)</text>
    <text x="360.0" y="483" font-size="10" fill="#475569" text-anchor="middle">Дашборды в Apache Superset</text>
    <text x="360.0" y="497" font-size="10" fill="#475569" text-anchor="middle">Тег: ANALYTICS_ANONYMIZED</text>
  </g>
  <!-- Data Store D1: Operational DBs (OLTP) -->
  <g filter="url(#shadow)">
    <rect x="540" y="105" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="105" x2="770" y2="105" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="200" x2="770" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="105" x2="540" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="105" x2="576" y2="200" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="156.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D1</text>
    <text x="586" y="125" font-size="12" font-weight="bold" fill="#0f172a">Operational DBs (OLTP)</text>
    <text x="586" y="141" font-size="10" fill="#64748b">Patient, Appointment, EHR DBs</text>
    <text x="586" y="154" font-size="10" fill="#64748b">Закрытый производственный контур</text>
    <text x="586" y="167" font-size="10" fill="#64748b">Прямой доступ аналитика ЗАПРЕЩЕН</text>
    <rect x="700" y="109" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="122" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Strict Isolation</text>
  </g>
  <!-- Data Store D2: Analytical Lake (ClickHouse) -->
  <g filter="url(#shadow)">
    <rect x="540" y="255" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="255" x2="770" y2="255" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="350" x2="770" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="255" x2="540" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="255" x2="576" y2="350" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="306.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D2</text>
    <text x="586" y="275" font-size="12" font-weight="bold" fill="#0f172a">Analytical Lake (ClickHouse)</text>
    <text x="586" y="291" font-size="10" fill="#64748b">Колоночная СУБД для аналитики</text>
    <text x="586" y="304" font-size="10" fill="#64748b">100% обезличенные данные!</text>
    <text x="586" y="317" font-size="10" fill="#64748b">Агрегаты выручки, нагрузки, услуг</text>
    <rect x="700" y="259" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="272" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">ClickHouse OLAP</text>
  </g>
  <!-- Data Store D3: Data Catalog (OpenMetadata) -->
  <g filter="url(#shadow)">
    <rect x="540" y="405" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="405" x2="770" y2="405" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="500" x2="770" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="405" x2="540" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="405" x2="576" y2="500" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="456.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D3</text>
    <text x="586" y="425" font-size="12" font-weight="bold" fill="#0f172a">Data Catalog (OpenMetadata)</text>
    <text x="586" y="441" font-size="10" fill="#64748b">Единый каталог метаданных</text>
    <text x="586" y="454" font-size="10" fill="#64748b">Сквозной Data Lineage от OLTP к BI</text>
    <text x="586" y="467" font-size="10" fill="#64748b">Политики маскирования и теги</text>
    <rect x="700" y="409" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="422" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Data Lineage</text>
  </g>
  <!-- Security Control: Принципы защиты -->
  <g>
    <rect x="800" y="180" width="160" height="195" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="880.0" y="196" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Принципы защиты</text>
    <text x="880.0" y="210" font-size="9" fill="#166534" text-anchor="middle">• Аналитик и AI физически</text>
    <text x="880.0" y="222" font-size="9" fill="#166534" text-anchor="middle">  НЕ ИМЕЮТ доступа к ПДн</text>
    <text x="880.0" y="234" font-size="9" fill="#166534" text-anchor="middle">• Никаких файлов на ноутбуках</text>
    <text x="880.0" y="246" font-size="9" fill="#166534" text-anchor="middle">• К-анонимизация и обобщение</text>
    <text x="880.0" y="258" font-size="9" fill="#166534" text-anchor="middle">• Сквозной Data Lineage</text>
    <text x="880.0" y="270" font-size="9" fill="#166534" text-anchor="middle">• Готовность к 5-кратному росту</text>
    <text x="880.0" y="282" font-size="9" fill="#166534" text-anchor="middle">  и обучению LLM/ML</text>
  </g>
  <line x1="540" y1="140" x2="470" y2="140" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="402.5" y="130.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="143.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">CDC поток изменений (Debezium)</text>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="241.25" y="210.5" width="237.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="223.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Потоковая передача в Privacy Engine</text>
  <line x1="470" y1="290" x2="540" y2="290" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="409.0" y="280.5" width="192.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="293.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Загрузка обезличенных данных</text>
  <line x1="360" y1="345" x2="360" y2="405" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="264.0" y="365.5" width="192.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="378.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Построение витрин отчетности</text>
  <line x1="470" y1="440" x2="540" y2="440" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="392.75" y="430.5" width="224.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="443.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Регистрация связей в Data Lineage</text>
  <line x1="200" y1="130" x2="250" y2="430" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="103.0" y="270.5" width="244.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="283.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Аналитик открывает BI Superset (Web)</text>
  <line x1="200" y1="280" x2="540" y2="310" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="254.5" y="285.5" width="231.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="370.0" y="298.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">ML обучение на ClickHouse витринах</text>
  <line x1="250" y1="460" x2="200" y2="460" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="119.25" y="450.5" width="211.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="463.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Дашборды руководству в браузере</text>
</svg>