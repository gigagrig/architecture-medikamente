<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 2 (As-Is): Запись пациента на приём к специалисту</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Текущее состояние: открытые Excel-файлы расписаний по докторам, раскрытие врачебной тайны, коллизии блокировок</text>

  <!-- External Entity: Пациент (Patient) -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="100" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="116" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="145" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Patient)</text>
    <text x="130.0" y="163" font-size="10" fill="#64748b" text-anchor="middle">Обращение по телефону
или лично на стойку</text>
  </g>
  <!-- External Entity: Ресепшен (Receptionist) -->
  <g filter="url(#shadow)">
    <rect x="40" y="250" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="250" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="266" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="295" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Ресепшен (Receptionist)</text>
    <text x="130.0" y="313" font-size="10" fill="#64748b" text-anchor="middle">Администратор ведет запись
в файлы расписаний</text>
  </g>
  <!-- External Entity: Врач (Doctor) -->
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="400" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="416" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="445" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Врач (Doctor)</text>
    <text x="130.0" y="463" font-size="10" fill="#64748b" text-anchor="middle">Медицинский специалист
15 сотрудников</text>
  </g>
  <!-- Process 2.1: Проверка расписания -->
  <g filter="url(#shadow)">
    <rect x="290" y="130" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 154 L 510 154" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="131" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="146" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 2.1</text>
    <text x="498" y="146" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Коллизии файлов</text>
    <text x="400.0" y="176" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Проверка расписания</text>
    <text x="400.0" y="194" font-size="10" fill="#475569" text-anchor="middle">Поиск свободного слота</text>
    <text x="400.0" y="208" font-size="10" fill="#475569" text-anchor="middle">в открытом файле Excel</text>
    <text x="400.0" y="222" font-size="10" fill="#475569" text-anchor="middle">Journal-Doctor-FIO.xlsx</text>
  </g>
  <!-- Process 2.2: Внесение записи на прием -->
  <g filter="url(#shadow)">
    <rect x="290" y="290" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 314 L 510 314" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="291" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="306" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 2.2</text>
    <text x="498" y="306" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Утечка врачебной тайны</text>
    <text x="400.0" y="336" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Внесение записи на прием</text>
    <text x="400.0" y="354" font-size="10" fill="#475569" text-anchor="middle">Ручной ввод ФИО, телефона,</text>
    <text x="400.0" y="368" font-size="10" fill="#475569" text-anchor="middle">специальности и причины</text>
    <text x="400.0" y="382" font-size="10" fill="#475569" text-anchor="middle">визита в ячейку таблицы</text>
  </g>
  <!-- Data Store D1: Файловый диск: \\Journals\* -->
  <g filter="url(#shadow)">
    <rect x="590" y="200" width="290" height="120" fill="#fff1f2" stroke="none"/>
    <line x1="590" y1="200" x2="880" y2="200" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="320" x2="880" y2="320" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="200" x2="590" y2="320" stroke="#dc2626" stroke-width="2"/>
    <line x1="626" y1="200" x2="626" y2="320" stroke="#dc2626" stroke-width="1.5"/>
    <text x="608" y="264.0" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">D1</text>
    <text x="636" y="220" font-size="12" font-weight="bold" fill="#0f172a">Файловый диск: \\Journals\*</text>
    <text x="636" y="236" font-size="10" fill="#64748b">Таблицы: Journal-Doctor-FIO.xlsx</text>
    <text x="636" y="249" font-size="10" fill="#64748b">Каждый врач и администратор имеет</text>
    <text x="636" y="262" font-size="10" fill="#64748b">доступ к расписанию ВСЕХ врачей клиники!</text>
    <text x="636" y="275" font-size="10" fill="#64748b">Нарушение ст. 13 323-ФЗ (врачебная тайна)</text>
    <rect x="810" y="204" width="65" height="18" rx="3" fill="#dc2626" fill-opacity="0.1"/>
    <text x="843" y="217" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Критический риск</text>
  </g>
  <line x1="220" y1="140" x2="290" y2="160" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="155.75" y="134.0" width="198.5" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="255.0" y="147.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Запрос записи: специальность,</text>
  <text x="255.0" y="159.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">ФИО, телефон, симптомы</text>
  <line x1="220" y1="275" x2="290" y2="190" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="185.0" y="216.5" width="140.0" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="255.0" y="229.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Открытие файла Excel</text>
  <text x="255.0" y="241.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">доктора через SMB</text>
  <line x1="390" y1="225" x2="390" y2="290" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="333.0" y="241.5" width="114.0" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="390.0" y="254.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Выбор свободного</text>
  <text x="390.0" y="266.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">слота времени</text>
  <line x1="510" y1="320" x2="590" y2="280" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="470.25" y="284.0" width="159.5" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="550.0" y="297.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Сохранение файла</text>
  <text x="550.0" y="309.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Journal-Doctor-FIO.xlsx</text>
  <line x1="220" y1="430" x2="590" y2="310" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="302.5" y="354.0" width="205.0" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="405.0" y="367.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Врач открывает расписание</text>
  <text x="405.0" y="379.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">(и может открыть чужие файлы!)</text>
</svg>