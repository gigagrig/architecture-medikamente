<svg xmlns="http://www.w3.org/2000/svg" width="1473" height="887" viewBox="0 0 1473 887" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 2 (As-Is): Запись пациента на приём к специалисту</title>
  <desc id="description">Текущее состояние: открытые Excel-файлы расписаний по докторам, раскрытие врачебной тайны, коллизии блокировок</desc>
  <rect width="1473" height="887" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 2 (As-Is): Запись пациента на приём к специалисту</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Текущее состояние: открытые Excel-файлы расписаний по докторам, раскрытие врачебной тайны, коллизии блокировок</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,854.5)">
    <title>DFD</title>
    <polygon fill="white" stroke="transparent" points="-8.64,8.64 -8.64,-720.14 1425.64,-720.14 1425.64,8.64 -8.64,8.64" />
    <g id="node1" class="node">
      <title>E1</title>
      <polygon fill="#f0f9ff" stroke="#0369a1" stroke-width="2" points="294,-667 0,-667 0,-561 294,-561 294,-667" />
      <text text-anchor="start" x="65.5" y="-642.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Внешняя сущность E1</text>
      <text text-anchor="start" x="60" y="-618.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Пациент (Patient)</text>
      <text text-anchor="start" x="55" y="-592.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Обращение по телефону</text>
      <text text-anchor="start" x="71.5" y="-577.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">или лично на стойку</text>
    </g>
    <g id="node4" class="node">
      <title>2.1</title>
      <path fill="#fff1f2" stroke="#b91c1c" stroke-width="2" d="M850,-686C850,-686 580,-686 580,-686 574,-686 568,-680 568,-674 568,-674 568,-554 568,-554 568,-548 574,-542 580,-542 580,-542 850,-542 850,-542 856,-542 862,-548 862,-554 862,-554 862,-674 862,-674 862,-680 856,-686 850,-686" />
      <text text-anchor="start" x="671" y="-661.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Процесс 2.1</text>
      <text text-anchor="start" x="608" y="-637.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Проверка расписания</text>
      <text text-anchor="start" x="626" y="-611.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Поиск свободного слота</text>
      <text text-anchor="start" x="626" y="-596.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">в открытом файле Excel</text>
      <text text-anchor="start" x="635.5" y="-581.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Journal-Doctor-FIO.xlsx</text>
      <text text-anchor="start" x="641" y="-559.8" font-family="DejaVu Sans" font-weight="bold" font-size="14.00" fill="#0f172a">Коллизии файлов</text>
    </g>
    <g id="flow_0" class="edge">
      <title>E1-&gt;2.1</title>
      <path fill="none" stroke="#b91c1c" stroke-width="1.8" d="M294.19,-561.71C308.18,-558.18 322.27,-555.17 336,-553 419.41,-539.81 442.59,-539.81 526,-553 536.94,-554.73 548.11,-556.99 559.27,-559.63" />
      <polygon fill="#b91c1c" stroke="#b91c1c" stroke-width="1.8" points="558.84,-562.59 567.81,-561.71 560.26,-556.81 558.84,-562.59" />
      <rect x="330.0" y="-602.8" width="202.0" height="51.0" rx="4" fill="white" />
      <text text-anchor="middle" x="431" y="-586.8" font-family="DejaVu Sans" font-size="14.00" fill="#b91c1c">Запрос записи:</text>
      <text text-anchor="middle" x="431" y="-571.8" font-family="DejaVu Sans" font-size="14.00" fill="#b91c1c">специальность,</text>
      <text text-anchor="middle" x="431" y="-556.8" font-family="DejaVu Sans" font-size="14.00" fill="#b91c1c">ФИО, телефон, симптомы</text>
    </g>
    <g id="node2" class="node">
      <title>E2</title>
      <polygon fill="#f0f9ff" stroke="#0369a1" stroke-width="2" points="294,-317 0,-317 0,-211 294,-211 294,-317" />
      <text text-anchor="start" x="65.5" y="-292.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Внешняя сущность E2</text>
      <text text-anchor="start" x="27.5" y="-268.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Ресепшен (Receptionist)</text>
      <text text-anchor="start" x="38.5" y="-242.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Администратор ведет запись</text>
      <text text-anchor="start" x="70.5" y="-227.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">в файлы расписаний</text>
    </g>
    <g id="flow_1" class="edge">
      <title>E2-&gt;2.1</title>
      <path fill="none" stroke="#475569" stroke-width="1.8" d="M240.2,-317.01C258.11,-327.5 276.69,-338.51 294,-349 396.26,-411 511.01,-483.61 594.69,-537.13" />
