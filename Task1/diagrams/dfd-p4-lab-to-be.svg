<svg xmlns="http://www.w3.org/2000/svg" width="1502" height="1048" viewBox="0 0 1502 1048" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 4 (To-Be): Защищенная интеграция с лабораторией (Lab API / mTLS)</title>
  <desc id="description">Целевое состояние: деперсонализация биоматериала (barcode token), mTLS API контракты, Webhook, исключение утечек</desc>
  <rect width="1502" height="1048" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 4 (To-Be): Защищенная интеграция с лабораторией (Lab API / mTLS)</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Целевое состояние: деперсонализация биоматериала (barcode token), mTLS API контракты, Webhook, исключение утечек</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
