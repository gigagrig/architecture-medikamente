      <text text-anchor="middle" x="715" y="-483.8" font-family="DejaVu Sans" font-size="14.00" fill="#b91c1c">(и может открыть чужие</text>
      <text text-anchor="middle" x="715" y="-468.8" font-family="DejaVu Sans" font-size="14.00" fill="#b91c1c">файлы!)</text>
    </g>
