<svg xmlns="http://www.w3.org/2000/svg" width="1572" height="1054" viewBox="0 0 1572 1054" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 1 (To-Be): Защищенная регистрация и онбординг пациента</title>
  <desc id="description">Целевое состояние: Data Minimization, TLS 1.3, Keycloak RBAC/ABAC, PostgreSQL TDE, MinIO S3 SSE-KMS, тегирование PII</desc>
  <rect width="1572" height="1054" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 1 (To-Be): Защищенная регистрация и онбординг пациента</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Целевое состояние: Data Minimization, TLS 1.3, Keycloak RBAC/ABAC, PostgreSQL TDE, MinIO S3 SSE-KMS, тегирование PII</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
  <g id="graph0" class="graph" transform="translate(28,845.0)">
    <title>DFD</title>
    <polygon fill="white" stroke="transparent" points="-8.64,8.64 -8.64,-710.64 1524.64,-710.64 1524.64,8.64 -8.64,8.64" />
    <g id="node1" class="node">
