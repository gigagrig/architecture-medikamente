<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="980" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 5 (To-Be): Защищенный платежный шлюз и фискализация (PCI DSS / 54-ФЗ)</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Целевое состояние: Payment Gateway, СБП/Эквайринг (без хранения карт), ОФД, 1С клиент-сервер по API/Kafka</text>

  <!-- External Entity: Пациент (Client) -->
  <g filter="url(#shadow)">
    <rect x="30" y="90" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="90" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="106" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="135" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Client)</text>
    <text x="115.0" y="153" font-size="10" fill="#64748b" text-anchor="middle">Оплата в App / ЛК / СБП
или терминал на кассе</text>
  </g>
  <!-- External Entity: Кассир / Ресепшен -->
  <g filter="url(#shadow)">
    <rect x="30" y="240" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="240" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="256" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="285" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Кассир / Ресепшен</text>
    <text x="115.0" y="303" font-size="10" fill="#64748b" text-anchor="middle">АРМ кассира (RBAC)
Формирование счетов</text>
  </g>
  <!-- External Entity: Банк-эквайер / ОФД -->
  <g filter="url(#shadow)">
    <rect x="30" y="400" width="170" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="30" y="400" width="170" height="24" rx="4" fill="#0284c7"/>
    <text x="115.0" y="416" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="115.0" y="445" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Банк-эквайер / ОФД</text>
    <text x="115.0" y="463" font-size="10" fill="#64748b" text-anchor="middle">Внешний шлюз эквайринга
Оператор фискальных данных</text>
  </g>
  <!-- Process 5.1: Billing & Invoicing Service -->
  <g filter="url(#shadow)">
    <rect x="250" y="95" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 119 L 470 119" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="96" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="111" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 5.1</text>
    <text x="458" y="111" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">Data Minimization</text>
    <text x="360.0" y="141" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Billing & Invoicing Service</text>
    <text x="360.0" y="159" font-size="10" fill="#475569" text-anchor="middle">Формирование инвойса по заказу.</text>
    <text x="360.0" y="173" font-size="10" fill="#475569" text-anchor="middle">Связка order_uuid + сумма.</text>
    <text x="360.0" y="187" font-size="10" fill="#475569" text-anchor="middle">Маскирование мед. диагнозов</text>
  </g>
  <!-- Process 5.2: Payment Gateway (PCI DSS) -->
  <g filter="url(#shadow)">
    <rect x="250" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 274 L 470 274" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="251" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="266" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 5.2</text>
    <text x="458" y="266" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">PCI DSS Level 1</text>
    <text x="360.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Payment Gateway (PCI DSS)</text>
    <text x="360.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Токенизация карт в банке.</text>
    <text x="360.0" y="328" font-size="10" fill="#475569" text-anchor="middle">Клиника НЕ хранит данные карт!</text>
    <text x="360.0" y="342" font-size="10" fill="#475569" text-anchor="middle">TLS 1.3 + криптоподпись webhook</text>
  </g>
  <!-- Process 5.3: Fiscal & 1C Sync Service -->
  <g filter="url(#shadow)">
    <rect x="250" y="405" width="220" height="95" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <path d="M 250 429 L 470 429" stroke="#16a34a" stroke-width="1"/>
    <rect x="251" y="406" width="218" height="23" rx="11" fill="#dcfce7"/>
    <text x="262" y="421" font-size="11" font-weight="bold" fill="#166534">ПРОЦЕСС 5.3</text>
    <text x="458" y="421" font-size="10" font-weight="bold" fill="#166534" text-anchor="end">54-ФЗ / Kafka</text>
    <text x="360.0" y="451" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Fiscal & 1C Sync Service</text>
    <text x="360.0" y="469" font-size="10" fill="#475569" text-anchor="middle">Автоматическая фискализация (54-ФЗ),</text>
    <text x="360.0" y="483" font-size="10" fill="#475569" text-anchor="middle">электронный чек по SMS/email,</text>
    <text x="360.0" y="497" font-size="10" fill="#475569" text-anchor="middle">событие в Kafka для клиент-серверной 1С</text>
  </g>
  <!-- Data Store D1: Billing DB (PostgreSQL) -->
  <g filter="url(#shadow)">
    <rect x="540" y="105" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="105" x2="770" y2="105" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="200" x2="770" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="105" x2="540" y2="200" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="105" x2="576" y2="200" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="156.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D1</text>
    <text x="586" y="125" font-size="12" font-weight="bold" fill="#0f172a">Billing DB (PostgreSQL)</text>
    <text x="586" y="141" font-size="10" fill="#64748b">Счета, транзакции, фискальные теги</text>
    <text x="586" y="154" font-size="10" fill="#64748b">Шифрование TDE</text>
    <text x="586" y="167" font-size="10" fill="#64748b">Тег: FINANCIAL_CONFIDENTIAL</text>
    <rect x="700" y="109" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="122" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">TDE / RLS</text>
  </g>
  <!-- Data Store D2: Audit & Kafka Pipeline -->
  <g filter="url(#shadow)">
    <rect x="540" y="255" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="255" x2="770" y2="255" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="350" x2="770" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="255" x2="540" y2="350" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="255" x2="576" y2="350" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="306.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D2</text>
    <text x="586" y="275" font-size="12" font-weight="bold" fill="#0f172a">Audit & Kafka Pipeline</text>
    <text x="586" y="291" font-size="10" fill="#64748b">Топик billing.payments.completed</text>
    <text x="586" y="304" font-size="10" fill="#64748b">Асинхронная доставка в бухгалтерию</text>
    <text x="586" y="317" font-size="10" fill="#64748b">Идемпотентность транзакций</text>
    <rect x="700" y="259" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="272" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">mTLS Kafka</text>
  </g>
  <!-- Data Store D3: 1С (Клиент-Сервер) -->
  <g filter="url(#shadow)">
    <rect x="540" y="405" width="230" height="95" fill="#f0fdf4" stroke="none"/>
    <line x1="540" y1="405" x2="770" y2="405" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="500" x2="770" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="540" y1="405" x2="540" y2="500" stroke="#16a34a" stroke-width="2"/>
    <line x1="576" y1="405" x2="576" y2="500" stroke="#16a34a" stroke-width="1.5"/>
    <text x="558" y="456.5" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">D3</text>
    <text x="586" y="425" font-size="12" font-weight="bold" fill="#0f172a">1С (Клиент-Сервер)</text>
    <text x="586" y="441" font-size="10" fill="#64748b">PostgreSQL база данных 1С</text>
    <text x="586" y="454" font-size="10" fill="#64748b">Интеграция по REST API/Kafka</text>
    <text x="586" y="467" font-size="10" fill="#64748b">Исключены файловые блокировки</text>
    <rect x="700" y="409" width="65" height="18" rx="3" fill="#16a34a" fill-opacity="0.1"/>
    <text x="733" y="422" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Enterprise 1C</text>
  </g>
  <!-- Security Control: Принципы защиты -->
  <g>
    <rect x="800" y="180" width="160" height="195" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="880.0" y="196" font-size="10" font-weight="bold" fill="#15803d" text-anchor="middle">Принципы защиты</text>
    <text x="880.0" y="210" font-size="9" fill="#166534" text-anchor="middle">• Данные карт НЕ попадают</text>
    <text x="880.0" y="222" font-size="9" fill="#166534" text-anchor="middle">  на сервер клиники (СБП)</text>
    <text x="880.0" y="234" font-size="9" fill="#166534" text-anchor="middle">• Бухгалтерия видит только код</text>
    <text x="880.0" y="246" font-size="9" fill="#166534" text-anchor="middle">  услуги (без диагнозов!)</text>
    <text x="880.0" y="258" font-size="9" fill="#166534" text-anchor="middle">• Исключен теневой Excel</text>
    <text x="880.0" y="270" font-size="9" fill="#166534" text-anchor="middle">• Электронный чек в ОФД</text>
    <text x="880.0" y="282" font-size="9" fill="#166534" text-anchor="middle">• Клиент-серверная 1С</text>
  </g>
  <line x1="200" y1="130" x2="250" y2="130" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="109.5" y="120.5" width="231.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="133.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Оплата: СБП / Карта / ЛК (TLS 1.3)</text>
  <line x1="200" y1="270" x2="250" y2="160" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="132.25" y="205.5" width="185.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="218.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Формирование счета на кассе</text>
  <line x1="360" y1="190" x2="360" y2="250" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="270.5" y="210.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="223.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Передача платежного токена</text>
  <line x1="250" y1="320" x2="200" y2="420" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="135.5" y="360.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="373.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Проведение платежа в банке</text>
  <line x1="200" y1="450" x2="250" y2="430" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="135.5" y="430.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="225.0" y="443.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Webhook от банка + ОФД чек</text>
  <line x1="470" y1="150" x2="540" y2="150" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="422.0" y="140.5" width="166.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="153.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Запись чека в Billing DB</text>
  <line x1="360" y1="345" x2="360" y2="405" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="270.5" y="365.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="360.0" y="378.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Фискализация и нотификация</text>
  <line x1="470" y1="440" x2="540" y2="310" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="402.5" y="365.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="505.0" y="378.0" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Событие PaymentSuccess в Kafka</text>
  <line x1="655" y1="350" x2="655" y2="405" stroke="#16a34a" stroke-width="1.5"  marker-end="url(#arrow-secure)"/>
  <rect x="591.5" y="368.0" width="127.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#16a34a" stroke-width="0.75"/>
  <text x="655.0" y="380.5" font-size="9.5" fill="#16a34a" font-weight="600" text-anchor="middle">Синхронизация с 1С</text>
</svg>