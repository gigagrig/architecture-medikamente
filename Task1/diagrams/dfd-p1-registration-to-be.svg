      <text text-anchor="start" x="66.5" y="-631.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Пациент (Client)</text>
      <text text-anchor="start" x="43" y="-605.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Web-портал / App / Планшет</text>
      <text text-anchor="start" x="61" y="-590.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Самостоятельный ввод</text>
    </g>
