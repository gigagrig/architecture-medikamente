<svg xmlns="http://www.w3.org/2000/svg" width="1464" height="916" viewBox="0 0 1464 916" role="img" aria-labelledby="title description">
  <title id="title">DFD Процесс 4 (As-Is): Направление и получение анализов из лаборатории</title>
  <desc id="description">Текущее состояние: открытый Exchange e-mail, незащищенные реестры анализов, отсутствие деперсонализации биоматериала</desc>
  <rect width="1464" height="916" fill="white" />
  <text x="28" y="32" font-family="DejaVu Sans" font-size="22" fill="#0f172a" font-weight="700">DFD Процесс 4 (As-Is): Направление и получение анализов из лаборатории</text>
  <text x="28" y="60" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Текущее состояние: открытый Exchange e-mail, незащищенные реестры анализов, отсутствие деперсонализации биоматериала</text>
  <text x="28" y="89" font-family="DejaVu Sans" font-size="14" fill="#334155" font-weight="400">Стрелка: направление передачи данных. Красный: уязвимость. Зелёный: мера защиты. Синий: внешний участник.</text>
