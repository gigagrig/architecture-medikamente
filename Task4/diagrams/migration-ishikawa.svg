  <rect x="690" y="1185" width="510" height="64" fill="#f8fafc" stroke="#be185d" rx="10" stroke-width="2" />
  <text x="702" y="1216" fill="#be185d" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold">
    <tspan x="702" dy="0">Персонал</tspan>
