<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 5 (As-Is): Оплата медицинских услуг и фискализация</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Текущее состояние: двойной учет (Excel + 1С), незащищенный протокол ККМ, файловая БД «1С:Бухгалтерия»</text>

  <!-- External Entity: Пациент (Patient) -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="100" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="116" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="145" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Patient)</text>
    <text x="130.0" y="163" font-size="10" fill="#64748b" text-anchor="middle">Оплата на кассе
наличные / карта</text>
  </g>
  <!-- External Entity: Кассир (Cashier) -->
  <g filter="url(#shadow)">
    <rect x="40" y="250" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="250" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="266" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="295" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Кассир (Cashier)</text>
    <text x="130.0" y="313" font-size="10" fill="#64748b" text-anchor="middle">3 сотрудника кассы
Двойной учет</text>
  </g>
  <!-- External Entity: ККМ (Кассовый аппарат) -->
  <g filter="url(#shadow)">
    <rect x="40" y="400" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="400" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="416" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="445" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">ККМ (Кассовый аппарат)</text>
    <text x="130.0" y="463" font-size="10" fill="#64748b" text-anchor="middle">Контрольно-кассовая машина
Связь по TCP/IP OLE</text>
  </g>
  <!-- Process 5.1: Прием платежа на кассе -->
  <g filter="url(#shadow)">
    <rect x="290" y="110" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 134 L 510 134" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="111" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="126" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 5.1</text>
    <text x="498" y="126" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Двойной учет</text>
    <text x="400.0" y="156" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Прием платежа на кассе</text>
    <text x="400.0" y="174" font-size="10" fill="#475569" text-anchor="middle">Расчет стоимости услуг,</text>
    <text x="400.0" y="188" font-size="10" fill="#475569" text-anchor="middle">прием средств, ввод в локальный</text>
    <text x="400.0" y="202" font-size="10" fill="#475569" text-anchor="middle">файл Excel кассира</text>
  </g>
  <!-- Process 5.2: Пробитие чека через ККМ -->
  <g filter="url(#shadow)">
    <rect x="290" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 274 L 510 274" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="251" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="266" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 5.2</text>
    <text x="498" y="266" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Незащищенный TCP/IP</text>
    <text x="400.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Пробитие чека через ККМ</text>
    <text x="400.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Передача команды в ККМ по TCP/IP</text>
    <text x="400.0" y="328" font-size="10" fill="#475569" text-anchor="middle">через устаревшую OLE-компоненту</text>
    <text x="400.0" y="342" font-size="10" fill="#475569" text-anchor="middle">без шифрования трафика</text>
  </g>
  <!-- Process 5.3: Проводка в «1С:Бухгалтерия» -->
  <g filter="url(#shadow)">
    <rect x="290" y="390" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 414 L 510 414" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="391" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="406" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 5.3</text>
    <text x="498" y="406" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Файловый режим 1С</text>
    <text x="400.0" y="436" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Проводка в «1С:Бухгалтерия»</text>
    <text x="400.0" y="454" font-size="10" fill="#475569" text-anchor="middle">Ручное создание документа оплаты</text>
    <text x="400.0" y="468" font-size="10" fill="#475569" text-anchor="middle">в файловой базе 1С по сети SMB</text>
    <text x="400.0" y="482" font-size="10" fill="#475569" text-anchor="middle">(риск порчи базы при сбое сети)</text>
  </g>
  <!-- Data Store D1: Локальный Excel кассира -->
  <g filter="url(#shadow)">
    <rect x="590" y="160" width="290" height="100" fill="#fff1f2" stroke="none"/>
    <line x1="590" y1="160" x2="880" y2="160" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="260" x2="880" y2="260" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="160" x2="590" y2="260" stroke="#dc2626" stroke-width="2"/>
    <line x1="626" y1="160" x2="626" y2="260" stroke="#dc2626" stroke-width="1.5"/>
    <text x="608" y="214.0" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">D1</text>
    <text x="636" y="180" font-size="12" font-weight="bold" fill="#0f172a">Локальный Excel кассира</text>
    <text x="636" y="196" font-size="10" fill="#64748b">Файлы учета платежей на ПК кассиров</text>
    <text x="636" y="209" font-size="10" fill="#64748b">Не централизованы, нет контроля доступа,</text>
    <text x="636" y="222" font-size="10" fill="#64748b">рассинхронизация с бухгалтерией</text>
    <rect x="810" y="164" width="65" height="18" rx="3" fill="#dc2626" fill-opacity="0.1"/>
    <text x="843" y="177" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Shadow Data</text>
  </g>
  <!-- Data Store D2: 1С:Бухгалтерия (файловая БД) -->
  <g filter="url(#shadow)">
    <rect x="590" y="340" width="290" height="110" fill="#fff1f2" stroke="none"/>
    <line x1="590" y1="340" x2="880" y2="340" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="450" x2="880" y2="450" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="340" x2="590" y2="450" stroke="#dc2626" stroke-width="2"/>
    <line x1="626" y1="340" x2="626" y2="450" stroke="#dc2626" stroke-width="1.5"/>
    <text x="608" y="399.0" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">D2</text>
    <text x="636" y="360" font-size="12" font-weight="bold" fill="#0f172a">1С:Бухгалтерия (файловая БД)</text>
    <text x="636" y="376" font-size="10" fill="#64748b">Сетевой путь: \\Server\1C_Buh\</text>
    <text x="636" y="389" font-size="10" fill="#64748b">• Блокировки таблиц</text>
    <text x="636" y="402" font-size="10" fill="#64748b">• Нет шифрования сетевого трафика</text>
    <text x="636" y="415" font-size="10" fill="#64748b">• Риск повреждения при скачке питания</text>
    <rect x="810" y="344" width="65" height="18" rx="3" fill="#dc2626" fill-opacity="0.1"/>
    <text x="843" y="357" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Риск потери данных</text>
  </g>
  <line x1="220" y1="135" x2="290" y2="140" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="168.75" y="128.0" width="172.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="255.0" y="140.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Передача наличных / карты</text>
  <line x1="220" y1="275" x2="290" y2="170" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="172.0" y="213.0" width="166.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="255.0" y="225.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Ввод суммы и ФИО в Excel</text>
  <line x1="510" y1="160" x2="590" y2="190" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="460.5" y="165.5" width="179.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="550.0" y="178.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Сохранение кассового Excel</text>
  <line x1="390" y1="205" x2="390" y2="250" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="310.25" y="218.0" width="159.5" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="390.0" y="230.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Команда на фискализацию</text>
  <line x1="290" y1="310" x2="220" y2="420" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="159.0" y="355.5" width="192.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="255.0" y="368.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">TCP/IP OLE (открытый трафик)</text>
  <line x1="220" y1="440" x2="220" y2="170" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="117.5" y="295.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="220.0" y="308.0" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Выдача бумажного чека пациенту</text>
  <line x1="390" y1="345" x2="390" y2="390" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="326.5" y="358.0" width="127.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="390.0" y="370.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Синхронизация с 1С</text>
  <line x1="510" y1="420" x2="590" y2="390" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="447.5" y="395.5" width="205.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="550.0" y="408.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Запись в файловую БД 1С по SMB</text>
</svg>