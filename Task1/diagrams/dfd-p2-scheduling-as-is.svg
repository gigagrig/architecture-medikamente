      <polygon fill="#f0f9ff" stroke="#0369a1" stroke-width="2" points="294,-488 0,-488 0,-382 294,-382 294,-488" />
      <text text-anchor="start" x="65.5" y="-463.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Внешняя сущность E3</text>
      <text text-anchor="start" x="80" y="-439.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Врач (Doctor)</text>
      <text text-anchor="start" x="51.5" y="-413.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Медицинский специалист</text>
      <text text-anchor="start" x="88.5" y="-398.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">15 сотрудников</text>
    </g>
    <g id="node6" class="node">
      <title>D1</title>
      <polygon fill="#fff1f2" stroke="transparent" points="1105,-516.5 1105,-711.5 1417,-711.5 1417,-516.5 1105,-516.5" />
