<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-vulnerable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-secure" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="920" height="60" fill="#1e293b"/>
  <text x="25" y="32" font-size="18" font-weight="bold" fill="#ffffff">DFD Процесс 3 (As-Is): Проведение медицинского приёма и ведение медкарты</text>
  <text x="25" y="50" font-size="12" fill="#94a3b8">Текущее состояние: файлы Word/Excel на файловом сервере, нет ЭЦП, нет версионирования, доступ открыт всей сети</text>

  <!-- External Entity: Пациент (Patient) -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="120" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="136" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="165" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Пациент (Patient)</text>
    <text x="130.0" y="183" font-size="10" fill="#64748b" text-anchor="middle">Очный прием в кабинете
Опрос, осмотр</text>
  </g>
  <!-- External Entity: Врач (Doctor) -->
  <g filter="url(#shadow)">
    <rect x="40" y="310" width="180" height="85" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="40" y="310" width="180" height="24" rx="4" fill="#0284c7"/>
    <text x="130.0" y="326" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ВНЕШНЯЯ СУЩНОСТЬ</text>
    <text x="130.0" y="355" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Врач (Doctor)</text>
    <text x="130.0" y="373" font-size="10" fill="#64748b" text-anchor="middle">Медицинский специалист
ПК в локальной сети</text>
  </g>
  <!-- Process 3.1: Поиск медкарты в проводнике -->
  <g filter="url(#shadow)">
    <rect x="290" y="100" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 124 L 510 124" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="101" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="116" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 3.1</text>
    <text x="498" y="116" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Нет аудита чтения</text>
    <text x="400.0" y="146" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Поиск медкарты в проводнике</text>
    <text x="400.0" y="164" font-size="10" fill="#475569" text-anchor="middle">Открытие сетевой папки</text>
    <text x="400.0" y="178" font-size="10" fill="#475569" text-anchor="middle">\\Pacients\Pacient1-FIO-BD</text>
    <text x="400.0" y="192" font-size="10" fill="#475569" text-anchor="middle">Чтение Word/PDF файлов</text>
  </g>
  <!-- Process 3.2: Осмотр и оформление карты -->
  <g filter="url(#shadow)">
    <rect x="290" y="250" width="220" height="95" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <path d="M 290 274 L 510 274" stroke="#dc2626" stroke-width="1"/>
    <rect x="291" y="251" width="218" height="23" rx="11" fill="#fee2e2"/>
    <text x="302" y="266" font-size="11" font-weight="bold" fill="#991b1b">ПРОЦЕСС 3.2</text>
    <text x="498" y="266" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="end">Нет юр. значимости</text>
    <text x="400.0" y="296" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Осмотр и оформление карты</text>
    <text x="400.0" y="314" font-size="10" fill="#475569" text-anchor="middle">Внесение жалоб, диагноза (МКБ),</text>
    <text x="400.0" y="328" font-size="10" fill="#475569" text-anchor="middle">назначений в локальный файл Word</text>
    <text x="400.0" y="342" font-size="10" fill="#475569" text-anchor="middle">БЕЗ цифровой подписи (ЭЦП)</text>
  </g>
  <!-- Process 3.3: Печать заключений -->
  <g filter="url(#shadow)">
    <rect x="290" y="390" width="220" height="95" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 290 414 L 510 414" stroke="#2563eb" stroke-width="1"/>
    <rect x="291" y="391" width="218" height="23" rx="11" fill="#eff6ff"/>
    <text x="302" y="406" font-size="11" font-weight="bold" fill="#1e40af">ПРОЦЕСС 3.3</text>
    <text x="498" y="406" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="end">Бумажный след</text>
    <text x="400.0" y="436" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Печать заключений</text>
    <text x="400.0" y="454" font-size="10" fill="#475569" text-anchor="middle">Вывод на локальный принтер</text>
    <text x="400.0" y="468" font-size="10" fill="#475569" text-anchor="middle">бумажного листа с диагнозом</text>
    <text x="400.0" y="482" font-size="10" fill="#475569" text-anchor="middle">и назначением лечения</text>
  </g>
  <!-- Data Store D1: Файловый диск: Медкарты пациентов -->
  <g filter="url(#shadow)">
    <rect x="590" y="160" width="300" height="140" fill="#fff1f2" stroke="none"/>
    <line x1="590" y1="160" x2="890" y2="160" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="300" x2="890" y2="300" stroke="#dc2626" stroke-width="2"/>
    <line x1="590" y1="160" x2="590" y2="300" stroke="#dc2626" stroke-width="2"/>
    <line x1="626" y1="160" x2="626" y2="300" stroke="#dc2626" stroke-width="1.5"/>
    <text x="608" y="234.0" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">D1</text>
    <text x="636" y="180" font-size="12" font-weight="bold" fill="#0f172a">Файловый диск: Медкарты пациентов</text>
    <text x="636" y="196" font-size="10" fill="#64748b">Каталоги \\Pacients\Pacient-FIO-BD\</text>
    <text x="636" y="209" font-size="10" fill="#64748b">Файлы DOCX, PDF, XLSX, JPG</text>
    <text x="636" y="222" font-size="10" fill="#64748b">• Доступен любому ПК в офисе</text>
    <text x="636" y="235" font-size="10" fill="#64748b">• Нет неизменяемости (WORM)</text>
    <text x="636" y="248" font-size="10" fill="#64748b">• Нет журналирования (кто читал?)</text>
    <text x="636" y="261" font-size="10" fill="#64748b">• Нарушение 323-ФЗ и УЗ-1 (ФСТЭК № 21)</text>
    <rect x="820" y="164" width="65" height="18" rx="3" fill="#dc2626" fill-opacity="0.1"/>
    <text x="853" y="177" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Критическая уязвимость</text>
  </g>
  <line x1="220" y1="150" x2="290" y2="150" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="191.5" y="134.0" width="127.0" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="255.0" y="147.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Озвучивание жалоб,</text>
  <text x="255.0" y="159.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">анамнез, симптомы</text>
  <line x1="220" y1="340" x2="290" y2="180" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="185.0" y="244.0" width="140.0" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="255.0" y="257.0" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Поиск папки пациента</text>
  <text x="255.0" y="269.0" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">в проводнике Windows</text>
  <line x1="390" y1="195" x2="390" y2="250" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="310.25" y="206.5" width="159.5" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="390.0" y="219.5" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Загрузка старых записей</text>
  <text x="390.0" y="231.5" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">в Word без аудита</text>
  <line x1="510" y1="270" x2="590" y2="230" stroke="#dc2626" stroke-width="1.5"  marker-end="url(#arrow-vulnerable)"/>
  <rect x="476.75" y="234.0" width="146.5" height="32" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#dc2626" stroke-width="0.75"/>
  <text x="550.0" y="247.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">Перезапись файла DOCX</text>
  <text x="550.0" y="259.0" font-size="9.5" fill="#dc2626" font-weight="600" text-anchor="middle">по открытому SMB</text>
  <line x1="390" y1="345" x2="390" y2="390" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="326.5" y="358.0" width="127.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="390.0" y="370.5" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Отправка на печать</text>
  <line x1="290" y1="430" x2="220" y2="200" stroke="#475569" stroke-width="1.5"  marker-end="url(#arrow-default)"/>
  <rect x="159.0" y="305.5" width="192.0" height="19" rx="3" fill="#ffffff" fill-opacity="0.95" stroke="#475569" stroke-width="0.75"/>
  <text x="255.0" y="318.0" font-size="9.5" fill="#475569" font-weight="600" text-anchor="middle">Бумажное заключение пациенту</text>
</svg>