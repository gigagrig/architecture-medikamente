    <tspan x="1330" dy="25">Непроверенная заморозка / возврат</tspan>
  </text>
  <line x1="1328" y1="988" x2="1779.6521739130435" y2="988" stroke="#4338ca" stroke-width="2" />
  <text x="1330" y="1056" fill="#172554" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">
    <tspan x="1330" dy="0">PRO-03</tspan>
