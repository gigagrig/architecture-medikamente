      <text text-anchor="start" x="80" y="-153.4" font-family="DejaVu Sans" font-weight="bold" font-size="17.00" fill="#0f172a">Врач (Doctor)</text>
      <text text-anchor="start" x="60.5" y="-127.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">АРМ врача (RBAC/ABAC)</text>
      <text text-anchor="start" x="27" y="-112.8" font-family="DejaVu Sans" font-size="14.00" fill="#0f172a">Видит ТОЛЬКО своих пациентов</text>
    </g>
    <g id="node6" class="node">
