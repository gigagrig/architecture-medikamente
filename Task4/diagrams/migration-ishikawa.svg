  </text>
  <line x1="1328" y1="1108" x2="1748.3478260869565" y2="1108" stroke="#4338ca" stroke-width="2" />
  <text x="77" y="1316" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal">
    <tspan x="77" dy="0">Главная ось → последствие. Наклонные ветви → категории. Горизонтальные ветви → возможные причины.</tspan>
    <tspan x="77" dy="25">Наличие причины не означает измеренную деградацию; подтверждение и приоритет мер — в migration-risks.md.</tspan>
